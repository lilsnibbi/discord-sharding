name: Bug report
description: Report incorrect orchestration, routing, assignment, or lifecycle behaviour.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include bot tokens, Bridge or administration tokens, database contents, or guild data.
        Suspected vulnerabilities go through the
        [security policy](https://github.com/lilsnibbi/discord-sharding/blob/main/SECURITY.md) instead of a public issue.

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.4
    validations:
      required: true

  - type: input
    id: bun
    attributes:
      label: Bun version
      description: Output of `bun --version`.
      placeholder: 1.3.14
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - HubClient
        - BridgeClient
        - ShardClient
        - Protocol or codec
        - SQLite persistence or migrations
        - Tooling, scripts, or CI
        - Documentation
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error class and message where one was thrown.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Topology (Hub, Bridge count, shard count), configuration with secrets redacted, and the exact steps.
      render: text
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Redacted logs, restart or rebalance history, and anything already ruled out.
