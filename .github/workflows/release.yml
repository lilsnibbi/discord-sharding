name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Automation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect commit message for release tag
        id: check_release
        run: |
          COMMIT_MSG=$(git log -1 --format=%B | tr -d '\r' | xargs)
          echo "Commit message: '$COMMIT_MSG'"
          if [[ "$COMMIT_MSG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
            echo "version=${COMMIT_MSG#v}" >> "$GITHUB_OUTPUT"
            echo "Release commit detected: $COMMIT_MSG"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit."
          fi

      - name: Set up Bun
        if: steps.check_release.outputs.is_release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        if: steps.check_release.outputs.is_release == 'true'
        run: bun install --frozen-lockfile

      - name: Run verification suite
        if: steps.check_release.outputs.is_release == 'true'
        run: bun run verify

      - name: Build verified release assets
        if: steps.check_release.outputs.is_release == 'true'
        run: bun run release:pack ${{ steps.check_release.outputs.tag_name }}

      - name: Create and push Git tag
        if: steps.check_release.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_release.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag $TAG..."
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          else
            echo "Tag $TAG already exists on remote."
          fi

      - name: Create GitHub Release
        if: steps.check_release.outputs.is_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_release.outputs.tag_name }}"
          echo "Creating GitHub Release for $TAG..."
          gh release create "$TAG" \
            release-assets/* \
            --title "$TAG" \
            --generate-notes || echo "GitHub release $TAG already exists."

      - name: Publish to NPM Registry
        if: steps.check_release.outputs.is_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"
          TARBALL="release-assets/snibbilabs-sharding-${VERSION}.tgz"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing $TARBALL to NPM..."
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            npm publish "$TARBALL" --access public
            echo "Successfully published $TARBALL to NPM!"
          else
            echo "Warning: NPM_TOKEN secret is not set in repository settings. Skipping NPM publish step."
          fi
