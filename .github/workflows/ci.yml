name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Check documentation links
        run: bun run check:docs

      - name: Type-check documentation examples
        run: bun run check:examples

      - name: Check import policy
        run: bun run check:imports

      - name: Check public JSDoc
        run: bun run check:jsdoc

      - name: Check maintained file lengths, formatting, and lint
        run: bun run check

      - name: Test
        run: bun run test

      - name: Test Redis integration
        run: bun run test:redis
        env:
          SHARDING_REDIS_URL: redis://127.0.0.1:6379

      - name: Coverage
        run: bun run test:coverage

      - name: Performance regression tests
        run: bun run test:performance

      - name: Validate release metadata
        run: bun run release:verify

      - name: Validate raw-source package consumers
        run: bun run pack:check
